<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #080d1b, #142849);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    color: white;
}

.container {
    width: 520px;
    max-width: 100%;
    background: #111c30;
    padding: 35px 25px;
    border-radius: 18px;
    border: 1px solid #263b59;
    box-shadow: 0 15px 50px rgba(0,0,0,0.4);
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 29px;
    margin-bottom: 10px;
}

.header p {
    color: #9aabc4;
    font-size: 14px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    color: #d8e3f5;
}

input, select {
    width: 100%;
    padding: 14px;
    border: 1px solid #30445f;
    border-radius: 8px;
    background: #0b1425;
    color: white;
    outline: none;
    font-size: 14px;
}

input:focus, select:focus {
    border-color: #38a5ff;
}

input::placeholder {
    color: #70819a;
}

select option {
    background: #111c30;
}

.signup-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(90deg, #168cff, #38c2ff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.signup-btn:hover {
    opacity: 0.85;
}

.signup-btn:disabled {
    opacity: 0.6;
    cursor: wait;
}

.message {
    display: none;
    margin-top: 18px;
    padding: 13px;
    border-radius: 8px;
    font-size: 13px;
    text-align: center;
}

.success {
    display: block;
    background: #123b2c;
    color: #6dffb1;
}

.error {
    display: block;
    background: #451e25;
    color: #ff9ba7;
}

.login {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: #9aabc4;
}

.login a {
    color: #40aaff;
    text-decoration: none;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Create Account</h1>

        <p>
            Register today and become part of our community.
        </p>

    </div>


    <form id="registrationForm">

        <div class="form-group">

            <label for="username">Username *</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                minlength="3"
                maxlength="30"
                pattern="[A-Za-z0-9_]+"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="firstname">First Name *</label>

            <input
                type="text"
                id="firstname"
                name="firstname"
                placeholder="Enter your first name"
                autocomplete="given-name"
                required
            >

        </div>


        <div class="form-group">

            <label for="surname">Surname *</label>

            <input
                type="text"
                id="surname"
                name="surname"
                placeholder="Enter your surname"
                autocomplete="family-name"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">Email Address *</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label for="phone">Phone Number *</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="+234 800 000 0000"
                autocomplete="tel"
                pattern="[+]?[0-9 ()-]{7,20}"
                required
            >

        </div>


        <div class="form-group">

            <label for="dob">Date of Birth</label>

            <input
                type="date"
                id="dob"
                name="dob"
            >

        </div>


        <div class="form-group">

            <label for="gender">Gender</label>

            <select id="gender" name="gender">

                <option value="">Select gender</option>

                <option value="male">Male</option>

                <option value="female">Female</option>

                <option value="other">Other</option>

                <option value="prefer-not-to-say">
                    Prefer not to say
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="password">Create Password *</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                autocomplete="new-password"
                required
            >

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password *
            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Enter password again"
                minlength="8"
                autocomplete="new-password"
                required
            >

        </div>


        <button
            type="submit"
            class="signup-btn"
            id="signupBtn"
        >
            SIGN UP
        </button>


        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
        ></div>

    </form>


    <div class="login">

        Already have an account?

        <a href="login.html">Log In</a>

    </div>

</div>


<script>

const form = document.getElementById("registrationForm");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const message = document.getElementById("message");

    const button = document.getElementById("signupBtn");

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    message.className = "message";

    message.textContent = "";


    if (password !== confirmPassword) {

        message.textContent = "Passwords do not match.";

        message.classList.add("error");

        return;

    }


    if (!form.reportValidity()) {

        return;

    }


    const userData = {

        username: document.getElementById("username").value.trim(),

        firstname: document.getElementById("firstname").value.trim(),

        surname: document.getElementById("surname").value.trim(),

        email: document.getElementById("email").value.trim(),

        phone: document.getElementById("phone").value.trim(),

        dob: document.getElementById("dob").value,

        gender: document.getElementById("gender").value,

        password: password

    };


    button.disabled = true;

    button.textContent = "PROCESSING...";


    try {

        const response = await fetch("/api/register", {

            method: "POST",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify(userData)

        });


        const result = await response.json();


        if (!response.ok) {

            throw new Error(
                result.message || "Registration failed."
            );

        }


        message.textContent =
            result.message ||
            "Your account has been created successfully!";

        message.classList.add("success");

        form.reset();


    } catch (error) {

        message.textContent =
            error.message === "Failed to fetch"
            ? "Unable to connect to the registration server. Please try again."
            : error.message;

        message.classList.add("error");


    } finally {

        button.disabled = false;

        button.textContent = "SIGN UP";

    }

});

</script>

</body>

</html>
